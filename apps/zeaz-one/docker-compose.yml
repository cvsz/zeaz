name: zeaz-one

services:
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ZEAZ_ONE_PORT:-18081}:8081"
      - "127.0.0.1:${ZEAZ_ONE_WWW_PORT:-18082}:8082"
      - "127.0.0.1:${ZEAZ_ONE_SUPPORT_PORT:-18083}:8083"
    volumes:
      - ./public:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs:
      - /config:size=16m,mode=0755
      - /data:size=16m,mode=0755
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.mjs"]
    environment:
      PORT: "8080"
      PRODUCT_PATH: "/app/product.json"
      NODE_ENV: production
    ports:
      - "127.0.0.1:${ZEAZ_ONE_API_PORT:-18084}:8080"
    volumes:
      - ./api:/app:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
