<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สมัครร้านค้า | MooPiew</title><link rel="stylesheet" href="/style.css"></head><body><main class="tracking"><p class="eyebrow">MOO PI EW MERCHANT</p><h1>สมัครร้านค้า</h1><p>ร่วมเป็นร้านค้าพันธมิตรกับ MooPiew</p><form id="merchant-register"><label>ชื่อร้าน<input name="business_name" required minlength="2"></label><label>ชื่อเจ้าของร้าน<input name="owner_name" required minlength="2"></label><label>เบอร์โทรศัพท์<input name="phone" inputmode="tel" required></label><label>อีเมล (ถ้ามี)<input name="email" type="email"></label><label>ประเภทร้าน/สินค้า<input name="category" required placeholder="เช่น อาหารปิ้งย่าง"></label><label>ที่อยู่ร้าน<textarea name="address" required></textarea></label><label>หมายเหตุ<textarea name="note"></textarea></label><button class="button">ส่งใบสมัครร้านค้า</button></form><p id="result" hidden></p></main><script src="/merchant-register.js"></script></body></html>
