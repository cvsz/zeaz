<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moopiew Operations</title><link rel="stylesheet" href="/style.css"></head><body><main class="tracking"><p class="eyebrow">OWNER OPERATIONS</p><h1>จัดการร้านค้า</h1><p>ไรเดอร์ · สต็อก · คูปอง · POS/ภาษี · <a href="/ai.html">Hugging Face AI</a></p><label>Admin key<input id="key" type="password" autocomplete="current-password"></label><button class="button" id="load">เปิดข้อมูลร้าน</button><div id="notice"></div><section id="workspace" hidden>
<h2>ใบสมัครร้านค้า</h2><div id="merchant-applications"></div><h2>ข้อมูลผู้ขายสำหรับภาษี</h2><form id="business-form"><label>ชื่อนิติบุคคล/ผู้ขาย<input name="legal_name" required></label><label>เลขผู้เสียภาษี 13 หลัก<input name="tax_id" inputmode="numeric"></label><label>ที่อยู่<input name="address" required></label><label>สาขา<input name="branch" value="สำนักงานใหญ่"></label><label><input name="vat_registered" type="checkbox"> จด VAT</label><button class="button">บันทึกข้อมูลผู้ขาย</button></form>
<h2>ค่าส่งตามระยะทาง</h2><form id="pricing-form"><label>ค่าตั้งต้น<input name="base_fee" type="number" min="0" value="55" required></label><label>เพิ่มต่อกิโลเมตร<input name="per_km_fee" type="number" min="0" step=".01" value="9" required></label><label>ระยะทางสูงสุด (กม.)<input name="maximum_km" type="number" min="1" step=".1" value="15" required></label><label>ละติจูดร้าน<input name="store_latitude" id="store-latitude" required></label><label>ลองจิจูดร้าน<input name="store_longitude" id="store-longitude" required></label><button type="button" class="text-button" id="store-location-button">ใช้ตำแหน่งอุปกรณ์นี้</button><button class="button">บันทึกอัตราค่าส่ง</button></form>
<h2>พื้นที่และงานจัดส่ง</h2><form id="zone-form"><label>ชื่อพื้นที่<input name="name" required placeholder="เช่น เขตวัฒนา"></label><label>ค่าส่ง fallback<input name="fee" type="number" min="0" required></label><label>ยอดขั้นต่ำ<input name="minimum_order" type="number" min="0" value="0"></label><button class="button">เพิ่มพื้นที่จัดส่ง</button></form><div id="zones"></div><h3>ใบสมัครไรเดอร์</h3><div id="rider-applications"></div><form id="rider-form"><label>ชื่อไรเดอร์<input name="name" required></label><label>โทรศัพท์<input name="phone"></label><button class="button">เพิ่มไรเดอร์</button></form><div id="riders"></div><div id="deliveries"></div>
<h2>สต็อกวัตถุดิบและสูตรเมนู</h2><form id="inventory-form"><label>ชื่อวัตถุดิบ<input name="name" required></label><label>หน่วย<input name="unit" placeholder="กก. / ชิ้น" required></label><label>คงเหลือ<input name="on_hand" type="number" step=".01" value="0"></label><label>จุดเตือน<input name="reorder_level" type="number" step=".01" value="0"></label><button class="button">เพิ่มวัตถุดิบ</button></form><div id="inventory"></div><form id="recipe-form"><label>เมนู<select name="menu_item_id" id="recipe-menu" required></select></label><label>วัตถุดิบ<select name="inventory_item_id" id="recipe-inventory" required></select></label><label>ใช้ต่อหนึ่งเมนู<input name="quantity" type="number" min=".01" step=".01" required></label><button class="button">บันทึกสูตร</button></form><div id="recipes"></div>
<h2>คูปอง</h2><form id="coupon-form"><label>รหัส<input name="code" required></label><label>ชนิด<select name="kind"><option value="fixed">ลดบาท</option><option value="percent">ลดเปอร์เซ็นต์</option></select></label><label>มูลค่า<input name="value" type="number" required></label><label>ขั้นต่ำ<input name="minimum_order" type="number" value="0"></label><label>จำนวนสิทธิ์ (0 ไม่จำกัด)<input name="maximum_uses" type="number" value="0"></label><button class="button">สร้างคูปอง</button></form><div id="coupons"></div><h2>ใบเสร็จและใบกำกับภาษี</h2><div id="receipts"></div></section></main><script src="/ops.js"></script></body></html>
