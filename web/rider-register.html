<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สมัครไรเดอร์ | MooPiew</title><link rel="stylesheet" href="/style.css"></head><body><main class="tracking"><p class="eyebrow">MOO PI EW RIDER</p><h1>สมัครเป็นไรเดอร์</h1><p>กรอกข้อมูลเพื่อให้ร้านตรวจสอบและอนุมัติการรับงาน</p><form id="rider-register"><label>ชื่อ–นามสกุล<input name="name" required minlength="2"></label><label>เบอร์โทรศัพท์<input name="phone" inputmode="tel" required></label><label>ยานพาหนะ<select name="vehicle_type" required><option value="motorcycle">มอเตอร์ไซค์</option><option value="bicycle">จักรยาน</option><option value="car">รถยนต์</option></select></label><label>ทะเบียนรถ (ถ้ามี)<input name="vehicle_plate"></label><label>หมายเหตุ<textarea name="note" placeholder="เช่น ช่วงเวลาที่รับงานได้"></textarea></label><button class="button">ส่งใบสมัคร</button></form><p id="result" hidden></p></main><script src="/rider-register.js"></script></body></html>
