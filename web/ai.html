<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MooPiew AI Console</title><link rel="stylesheet" href="/style.css"></head><body><main class="tracking"><p class="eyebrow">OWNER AI CONSOLE</p><h1>Hugging Face model catalog</h1><p>เลือกโมเดล chat ที่ Router อนุญาตสำหรับ token ของร้าน คีย์จะใช้เฉพาะ request นี้และไม่ถูกบันทึกในเบราว์เซอร์</p><p><a href="/ops.html">← กลับหน้าจัดการร้าน</a></p><label>Admin key<input id="key" type="password" autocomplete="current-password"></label><button class="button" id="load">โหลดสถานะและโมเดล</button><div id="notice" role="status"></div><section id="workspace" hidden><label>Model<select id="model"></select></label><label>คำสั่งสำหรับ AI<textarea id="prompt" rows="8" maxlength="12000" placeholder="เช่น ช่วยร่างข้อความโปรโมชันหมูปิ้ง โดยไม่ใช้ข้อมูลลูกค้าหรือข้อมูลชำระเงิน"></textarea></label><div class="form-grid"><label>คำตอบสูงสุด (token)<input id="max-tokens" type="number" min="1" max="2048" value="512"></label><label>Temperature<input id="temperature" type="number" min="0" max="2" step=".1" value=".2"></label></div><button class="button" id="send">ส่งคำสั่ง</button><h2>คำตอบ</h2><pre id="result" class="ai-result"></pre></section></main><script src="/ai.js"></script></body></html>
