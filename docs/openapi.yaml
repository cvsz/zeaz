openapi: 3.1.0
info:
  title: Moo Piw Piw API
  version: 1.0.0
  description: Preorder and restaurant operations API. Protected endpoints require their role-specific API key header.
paths:
  /api/health:
    get: {summary: Liveness probe, responses: {'200': {description: Service process is healthy}}}
  /api/ready:
    get: {summary: Readiness probe, responses: {'200': {description: Database is reachable}}}
  /api/status:
    get: {summary: Public operational status without secrets, responses: {'200': {description: Service and dependency status}}}
  /api/menu:
    get: {summary: Get live storefront data including menu, pickup capacity, brand theme and navigation links (visual preview at /menu-preview.html), responses: {'200': {description: Live storefront payload}}}
  /api/orders:
    post: {summary: Create preorder, responses: {'201': {description: Created}}}
  /api/order-lookup:
    post: {summary: Look up an order using ID and phone, responses: {'200': {description: Found}}}
  /api/payments/scb/config:
    get: {summary: Public SCB QR capability flag; never exposes credentials, responses: {'200': {description: Payment capability}}}
  /api/orders/{orderId}/payments/scb/qr:
    post: {summary: Create an SCB Mae Manee QR for an existing SCB QR order; matching customer phone required, parameters: [{name: orderId, in: path, required: true, schema: {type: string}}], responses: {'201': {description: QR payment attempt}}}
  /api/scb/payment/confirm:
    post: {summary: SCB payment-confirmation callback; payment is verified by a server-side SCB inquiry before state changes, responses: {'200': {description: Verified payment state}, '401': {description: Invalid optional callback signature}, '503': {description: SCB inquiry is unavailable}}}
  /api/admin/payments/scb/{paymentId}/inquire:
    post: {summary: Owner-only fallback SCB payment inquiry, security: [{adminKey: []}], parameters: [{name: paymentId, in: path, required: true, schema: {type: string}}], responses: {'200': {description: Payment status}}}
  /api/admin/dashboard:
    get: {summary: Owner dashboard, security: [{adminKey: []}], responses: {'200': {description: Dashboard}}}
  /api/staff/dashboard:
    get: {summary: Staff pickup queue, security: [{employeeKey: []}], responses: {'200': {description: Queue}}}
  /api/kitchen/dashboard:
    get: {summary: Kitchen pickup queue, security: [{kitchenKey: []}], responses: {'200': {description: Queue}}}
components:
  securitySchemes:
    adminKey: {type: apiKey, in: header, name: X-Admin-Key}
    employeeKey: {type: apiKey, in: header, name: X-Employee-Key}
    kitchenKey: {type: apiKey, in: header, name: X-Kitchen-Key}
