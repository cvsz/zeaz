apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: engineering-dashboard
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: dashboard-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "ZEAZ engineering dashboard"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dashboard.example.invalid
      secretName: dashboard-tls
  rules:
    - host: dashboard.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: engineering-dashboard
                port:
                  name: http
