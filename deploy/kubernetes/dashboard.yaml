apiVersion: apps/v1
kind: Deployment
metadata:
  name: engineering-dashboard
  labels:
    app.kubernetes.io/name: moopiew
    app.kubernetes.io/component: engineering-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: moopiew
      app.kubernetes.io/component: engineering-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: moopiew
        app.kubernetes.io/component: engineering-dashboard
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: ghcr.io/cvsz/zeaz-dashboard:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: engineering-dashboard
spec:
  selector:
    app.kubernetes.io/name: moopiew
    app.kubernetes.io/component: engineering-dashboard
  ports:
    - name: http
      port: 8080
      targetPort: http
