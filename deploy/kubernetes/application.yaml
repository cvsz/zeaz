apiVersion: apps/v1
kind: Deployment
metadata:
  name: moopiew
  labels:
    app.kubernetes.io/name: moopiew
    app.kubernetes.io/component: application
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: moopiew
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: moopiew
        app.kubernetes.io/component: application
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: ghcr.io/cvsz/zeaz:1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: moopiew-config
            - secretRef:
                name: moopiew-runtime
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /var/lib/moopiew
            - name: tmp
              mountPath: /tmp
      terminationGracePeriodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: moopiew-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: moopiew
spec:
  selector:
    app.kubernetes.io/name: moopiew
    app.kubernetes.io/component: application
  ports:
    - name: http
      port: 8000
      targetPort: http
