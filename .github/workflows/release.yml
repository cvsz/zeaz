name: Build release archive

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: npm
      - name: Install validation dependencies
        run: |
          python3 -m pip install --requirement requirements-dev.txt
          npm ci
      - name: Validate release source
        run: |
          npm run lint
          npm run typecheck
          npm run build
          python3 scripts/ci/evidence.py security
          python3 scripts/ci/evidence.py coverage
          SKIP_PYTHON_TESTS=true ./scripts/ci/test.sh
          ./scripts/ci/smoke-api.sh
          docker build --build-arg VCS_REF="${GITHUB_SHA}" -t zeaz/moopiew:release .
          docker build --build-arg VCS_REF="${GITHUB_SHA}" -f dashboard/Dockerfile -t zeaz/dashboard:release .
          docker image inspect --format '{{.Id}}' zeaz/moopiew:release zeaz/dashboard:release > /tmp/zeaz-image-ids
          ./scripts/ci/install-kubernetes-tools.sh
          ./scripts/ci/validate-kubernetes.sh
          python3 scripts/ci/evidence.py performance
          python3 scripts/ci/evidence.py infrastructure
      - name: Create source archive
        run: |
          release_name="${GITHUB_REF_NAME//\//-}"
          echo "RELEASE_NAME=$release_name" >> "$GITHUB_ENV"
          git archive --format=zip --output "moopiew-$release_name.zip" HEAD
          python3 -m pip_audit --requirement requirements.txt \
            --format cyclonedx-json --progress-spinner off --strict \
            --output "moopiew-$release_name-python.cdx.json"
          python3 scripts/ci/generate_sbom.py \
            --output "moopiew-$release_name-npm.cdx.json"
          python3 scripts/ci/validate_sbom.py \
            --schema-version 1.4 "moopiew-$release_name-python.cdx.json"
          python3 scripts/ci/validate_sbom.py \
            --schema-version 1.6 "moopiew-$release_name-npm.cdx.json"
          sha256sum \
            "moopiew-$release_name.zip" \
            "moopiew-$release_name-python.cdx.json" \
            "moopiew-$release_name-npm.cdx.json" \
            > "moopiew-$release_name.sha256"
      - name: Attest release provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v4.1.1
        with:
          subject-checksums: moopiew-${{ env.RELEASE_NAME }}.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moopiew-source
          path: |
            moopiew-*.zip
            moopiew-*.cdx.json
            moopiew-*.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: archive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: moopiew-source
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" moopiew-* --generate-notes --verify-tag
