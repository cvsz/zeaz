name: Build release archive

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
      - name: Install validation dependencies
        run: |
          python3 -m pip install --requirement requirements-dev.txt
          npm ci
      - name: Validate release source
        run: |
          npm run lint
          npm run typecheck
          npm run build
          python3 scripts/ci/evidence.py security
          python3 scripts/ci/evidence.py coverage
          SKIP_PYTHON_TESTS=true ./scripts/ci/test.sh
          ./scripts/ci/smoke-api.sh
          docker build --build-arg VCS_REF="${GITHUB_SHA}" -t zeaz/moopiew:release .
          docker build --build-arg VCS_REF="${GITHUB_SHA}" -f dashboard/Dockerfile -t zeaz/dashboard:release .
          docker image inspect --format '{{.Id}}' zeaz/moopiew:release zeaz/dashboard:release > /tmp/zeaz-image-ids
          ./scripts/ci/install-kubernetes-tools.sh
          ./scripts/ci/validate-kubernetes.sh
          python3 scripts/ci/evidence.py performance
          python3 scripts/ci/evidence.py infrastructure
      - name: Create source archive
        run: |
          release_name="${GITHUB_REF_NAME//\//-}"
          echo "RELEASE_NAME=$release_name" >> "$GITHUB_ENV"
          git archive --format=zip --output "moopiew-$release_name.zip" HEAD
          python3 -m pip_audit --requirement requirements.txt \
            --format cyclonedx-json --progress-spinner off --strict \
            --output "moopiew-$release_name-python.cdx.json"
          python3 scripts/ci/generate_sbom.py \
            --output "moopiew-$release_name-npm.cdx.json"
          python3 scripts/ci/validate_sbom.py \
            --schema-version 1.4 "moopiew-$release_name-python.cdx.json"
          python3 scripts/ci/validate_sbom.py \
            --schema-version 1.6 "moopiew-$release_name-npm.cdx.json"
          sha256sum \
            "moopiew-$release_name.zip" \
            "moopiew-$release_name-python.cdx.json" \
            "moopiew-$release_name-npm.cdx.json" \
            > "moopiew-$release_name.sha256"
      - name: Attest release provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v4.1.1
        with:
          subject-checksums: moopiew-${{ env.RELEASE_NAME }}.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moopiew-source
          path: |
            moopiew-*.zip
            moopiew-*.cdx.json
            moopiew-*.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: archive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: moopiew-source
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" moopiew-* --generate-notes --verify-tag

  images:
    if: startsWith(github.ref, 'refs/tags/')
    needs: archive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Define immutable image coordinates
        id: images
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          release_tag="${GITHUB_REF_NAME//\//-}"
          echo "app=ghcr.io/$repository/moopiew" >> "$GITHUB_OUTPUT"
          echo "dashboard=ghcr.io/$repository/dashboard" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and publish application image
        id: app
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          sbom: true
          provenance: mode=max
          build-args: VCS_REF=${{ github.sha }}
          tags: |
            ${{ steps.images.outputs.app }}:${{ steps.images.outputs.release_tag }}
            ${{ steps.images.outputs.app }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Attest application image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v4.1.1
        with:
          subject-name: ${{ steps.images.outputs.app }}
          subject-digest: ${{ steps.app.outputs.digest }}
          push-to-registry: true
      - name: Build and publish dashboard image
        id: dashboard
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: dashboard/Dockerfile
          push: true
          sbom: true
          provenance: mode=max
          build-args: VCS_REF=${{ github.sha }}
          tags: |
            ${{ steps.images.outputs.dashboard }}:${{ steps.images.outputs.release_tag }}
            ${{ steps.images.outputs.dashboard }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Attest dashboard image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v4.1.1
        with:
          subject-name: ${{ steps.images.outputs.dashboard }}
          subject-digest: ${{ steps.dashboard.outputs.digest }}
          push-to-registry: true
