name: Build release archive

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: git archive --format=zip --output business-in-a-box-${{ github.ref_name }}.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: business-in-a-box
          path: business-in-a-box-*.zip
