name: Build release archive

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Create source archive
        run: git archive --format=zip --output moopiew-${{ github.ref_name }}.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: moopiew-source
          path: moopiew-*.zip
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "moopiew-${{ github.ref_name }}.zip" --generate-notes --verify-tag
