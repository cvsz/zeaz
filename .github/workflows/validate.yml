name: Validate MooPiew

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - name: Install validation dependencies
        run: |
          python3 -m pip install --requirement requirements.txt
          npm ci
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Run platform checks
        run: ./scripts/ci/test.sh
      - name: Run isolated API smoke checks
        run: ./scripts/ci/smoke-api.sh
      - name: Generate example business kit
        run: ./scripts/generate.sh examples/cafe.yaml /tmp/cafe-kit
      - name: Package example business kit
        run: ./scripts/package.sh /tmp/cafe-kit /tmp/cafe-kit.zip
