name: Validate MooPiew

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - name: Install validation dependencies
        run: |
          python3 -m pip install --requirement requirements.txt
          npm ci
      - name: Check shell syntax
        run: find scripts assets/asset-generator -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Run lint gate
        run: npm run lint
      - name: Audit dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          python3 -m pip check
      - name: Run platform checks
        run: ./scripts/ci/test.sh
      - name: Run Python regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Run isolated API smoke checks
        run: ./scripts/ci/smoke-api.sh
      - name: Generate example business kit
        run: ./scripts/generate.sh examples/cafe.yaml /tmp/cafe-kit
      - name: Package example business kit
        run: ./scripts/package.sh /tmp/cafe-kit /tmp/cafe-kit.zip
