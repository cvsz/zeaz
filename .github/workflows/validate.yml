name: Validate MooPiew

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
      - name: Install validation dependencies
        run: |
          python3 -m venv "${RUNNER_TEMP}/zeaz-validation-venv"
          "${RUNNER_TEMP}/zeaz-validation-venv/bin/python" -m pip install --requirement requirements-dev.txt
          echo "${RUNNER_TEMP}/zeaz-validation-venv/bin" >> "${GITHUB_PATH}"
          npm ci
      - name: Check shell syntax
        run: find scripts assets/asset-generator -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Run lint gate
        run: npm run lint
      - name: Audit dependencies
        run: python3 scripts/ci/evidence.py security
      - name: Run Python tests with coverage
        run: python3 scripts/ci/evidence.py coverage
      - name: Run platform checks
        env:
          SKIP_PYTHON_TESTS: "true"
        run: ./scripts/ci/test.sh
      - name: Build deployment images
        run: |
          docker build --build-arg VCS_REF="${GITHUB_SHA}" -t zeaz/moopiew:ci .
          docker build --build-arg VCS_REF="${GITHUB_SHA}" -f dashboard/Dockerfile -t zeaz/dashboard:ci .
          docker image inspect --format '{{.Id}}' zeaz/moopiew:ci zeaz/dashboard:ci > /tmp/zeaz-image-ids
      - name: Validate rendered Kubernetes manifests
        run: |
          ./scripts/ci/install-kubernetes-tools.sh
          ./scripts/ci/validate-kubernetes.sh
      - name: Validate deployment controls
        run: python3 scripts/ci/evidence.py infrastructure
      - name: Validate performance budgets
        if: always()
        run: python3 scripts/ci/evidence.py performance
      - name: Run isolated API smoke checks
        run: ./scripts/ci/smoke-api.sh
      - name: Generate example business kit
        run: ./scripts/generate.sh examples/cafe.yaml /tmp/cafe-kit
      - name: Package example business kit
        run: ./scripts/package.sh /tmp/cafe-kit /tmp/cafe-kit.zip
      - name: Publish final engineering evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "$JOB_STATUS" == "success" ]]; then status=pass; else status=fail; fi
          python3 scripts/ci/evidence.py report ci "$status" "Validation workflow status: $JOB_STATUS."
          python3 scripts/ci/evidence.py report agents not_applicable "Agent execution state is not available to the CI runtime."
          python3 -m dashboard.api.health > dashboard/data/health.json
      - name: Upload engineering evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engineering-evidence
          path: dashboard/data/*.json
          if-no-files-found: error
